<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View CV | Viet Thanh</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f5f7fb;
        background: #090b0f;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #090b0f; }
      .page { width: min(1180px, calc(100% - 32px)); min-height: 100vh; margin: 0 auto; padding: 24px 0; display: flex; flex-direction: column; gap: 18px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); letter-spacing: -0.04em; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .button { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; color: #f5f7fb; background: rgba(255,255,255,.07); font-size: 13px; font-weight: 700; text-decoration: none; }
      .button-primary { color: #090b0f; background: #f5f7fb; }
      .viewer { flex: 1; min-height: 0; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; overflow: hidden; background: #1a1e26; }
      iframe { display: block; width: 100%; height: min(78vh, 1100px); min-height: 620px; border: 0; }
      @media (max-width: 640px) {
        .page { width: min(100% - 20px, 1180px); padding: 14px 0; }
        .topbar { align-items: flex-start; flex-direction: column; }
        .viewer iframe { min-height: 72vh; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <h1>Curriculum Vitae</h1>
        <div class="actions">
          <a class="button" href="/">Back to portfolio</a>
          <a class="button button-primary" href="/Nguyen-Viet-Thanh-CV.pdf" download>Download CV</a>
        </div>
      </header>
      <section class="viewer" aria-label="CV PDF viewer">
        <iframe src="/Nguyen-Viet-Thanh-CV.pdf" title="Nguyen Viet Thanh CV"></iframe>
      </section>
    </main>
  </body>
</html>
